<svg width="64" height="64" viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#6c5ce7"/>
      <stop offset="100%" stop-color="#00b894"/>
    </linearGradient>
  </defs>
  <!-- A solid, full-bleed dark SQUARE, on purpose. Google Search shows favicons
       in a 28px circle and picks one of two treatments (measured on live dark-mode
       results, Oct 2026): an icon whose corners are all one solid colour is
       cropped to fill the circle (how x.com and vercel.com get a full dark
       circle); anything else is shrunk to 18px on Google's own white circle,
       which leaves a white ring. That caught both earlier tries: the July square's
       gradient gave it four different corners, and the Aug-Oct circle's corners
       were transparent. So: no transparency, a flat background, every corner
       #1a1a24, and the W kept inside the inscribed circle so the crop never
       clips it. favicon.png is this design rendered at 192px. -->
  <rect width="64" height="64" fill="#1a1a24"/>
  <text x="32" y="47"
        text-anchor="middle"
        font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif"
        font-weight="900"
        font-size="44"
        fill="url(#g)">W</text>
</svg>
