<svg width="64" height="64" viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#6c5ce7"/>
      <stop offset="100%" stop-color="#00b894"/>
    </linearGradient>
  </defs>
  <!-- Circular mark, dark base, gradient W.
       Google does NOT crop favicons to a circle — it draws the icon INSIDE a
       white circular badge with padding around it. A square therefore always
       reads as a sticker pasted into a circle (corners crowding the rim), which
       is what the previous full-bleed square looked like. A circle that fills
       the whole canvas instead sits concentrically inside Google's badge, so the
       surrounding white reads as intentional framing rather than dead space.
       Keeping the corners transparent also lets Google's converter emit PNG with
       alpha rather than flattening the art to JPEG. -->
  <circle cx="32" cy="32" r="32" fill="#1a1a24"/>
  <!-- Gradient W on the dark base keeps the brand palette (matches the wordmark)
       and stays legible at 16px because the contrast is glyph-vs-dark, not
       glyph-vs-white-badge. -->
  <text x="32" y="51"
        text-anchor="middle"
        font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif"
        font-weight="900"
        font-size="56"
        fill="url(#g)">W</text>
</svg>
