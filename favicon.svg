<svg width="64" height="64" viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#6c5ce7"/>
      <stop offset="100%" stop-color="#00b894"/>
    </linearGradient>
  </defs>
  <!-- Two looks from one file, switched by color scheme.
       Default (light, and whatever Google's favicon converter renders): the
       gradient W alone on a transparent canvas. Google Search draws every
       favicon at ~70% inside its own white circular badge (measured Oct 2026:
       47px badge, 33px icon), so a dark disc always showed a white ring around
       it — the full-bleed square before it read as a sticker in a circle. With
       no disc, Google's white badge becomes the W's background and there is no
       ring left to see.
       Dark: the dark disc comes back so the W keeps its contrast on dark tab
       strips. If a renderer ignores <style>, the disc shows — which is exactly
       the previous icon, so the worst case is no change. -->
  <style>
    .disc { display: none; }
    @media (prefers-color-scheme: dark) { .disc { display: inline; } }
  </style>
  <circle class="disc" cx="32" cy="32" r="32" fill="#1a1a24"/>
  <text x="32" y="51"
        text-anchor="middle"
        font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif"
        font-weight="900"
        font-size="56"
        fill="url(#g)">W</text>
</svg>
