<svg width="64" height="64" viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#6c5ce7"/>
      <stop offset="100%" stop-color="#00b894"/>
    </linearGradient>
  </defs>
  <!-- Full-bleed background: fill the ENTIRE canvas edge to edge. Google's
       search results crop favicons into their own circular badge, so any
       transparent corners on our side render as a white halo around the mark
       (the previous version was a dark circle on a transparent square).
       A rim-to-rim gradient square survives every crop shape — Google's
       circle, browser-tab rounded square, iOS masks — with zero dead space. -->
  <rect width="64" height="64" fill="url(#g)"/>
  <!-- White W reads at 16px where gradient-on-dark text turned to mush. -->
  <text x="32" y="50"
        text-anchor="middle"
        font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif"
        font-weight="900"
        font-size="50"
        fill="#ffffff">W</text>
</svg>
